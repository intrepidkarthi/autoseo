name: collect

# Phase 0 — measurement only. This workflow reads; it never publishes.
# Bound to the `compose` environment, which holds no publishing credential — so this workflow
# cannot post anywhere even if something goes wrong. Publishing secrets live in a separate
# `publishing` environment (Phase 4+) that is gated behind a required reviewer.

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST. GitHub cron is best-effort and often fires 10-30 min late.
  workflow_dispatch:
    inputs:
      inspect_limit:
        description: "Sitemap URLs to inspect this run (156 total, quota 2000/day)"
        required: false
        default: "200"
      sample_orphans:
        description: "One-time: inspect N de-listed URLs per cluster (0 = skip)"
        required: false
        default: "0"
      backfill:
        description: "One-time: pull the full 16-month GSC history (true/false)"
        required: false
        default: "false"
      draft:
        description: "Draft N posts against measured demand and queue them (0 = skip)"
        required: false
        default: "0"
      aeo_tier:
        description: "AEO panel tier to run: core | extended | all | skip"
        required: false
        default: "skip"
      diagnose:
        description: "Diagnostic: isolate where GSC impressions go missing (true/false)"
        required: false
        default: "false"

concurrency:
  group: autoseo-state
  cancel-in-progress: false

permissions:
  contents: write   # to commit state/ back — this also keeps the 60-day schedule timer alive

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Collect
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOSEO_INSPECT_LIMIT: ${{ github.event.inputs.inspect_limit || '200' }}
        run: |
          autoseo restore
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            autoseo diagnose
            exit 0
          fi
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            autoseo gsc --backfill
          fi
          autoseo inventory
          autoseo collect
          if [ "${{ github.event.inputs.sample_orphans || '0' }}" != "0" ]; then
            autoseo inspect --sample-orphans ${{ github.event.inputs.sample_orphans }}
          fi
          if [ "${{ github.event.inputs.aeo_tier || 'skip' }}" != "skip" ]; then
            if [ "${{ github.event.inputs.aeo_tier }}" = "models" ]; then
              autoseo aeo --list-models
              exit 0
            fi
            autoseo aeo --tier ${{ github.event.inputs.aeo_tier }}
            autoseo outreach
          fi
          autoseo brief
          if [ "${{ github.event.inputs.draft || '0' }}" != "0" ]; then
            autoseo draft --top ${{ github.event.inputs.draft }} --queue
          fi
          autoseo snapshot

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"

          # Concurrent runs (a dispatch and a cron tick) both write state/*.csv, and git cannot
          # merge them — an earlier attempt at `pull --rebase` hit a CSV conflict and left a
          # detached HEAD. But the database CAN merge: `restore` upserts, so loading the remote
          # snapshot into our db produces the union of both sides. So on rejection we take the
          # remote files, re-merge through the app, and re-snapshot. The db is gitignored, so
          # `reset --hard` never touches the rows we are trying to save.
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then
              echo "No state changes."
              exit 0
            fi
            git commit -q -m "state: collect $(date -u +%Y-%m-%d)"
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "state pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — merging remote state through the database"
            git fetch -q origin main
            git reset -q --hard origin/main
            autoseo restore >/dev/null
            autoseo snapshot >/dev/null
          done
          echo "::warning::could not push state after 3 attempts; it will merge on the next run"
