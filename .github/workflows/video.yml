name: video

# Generate a Short. Every step is free: Gemini free tier for the script, Kokoro-82M on CPU for the
# voiceover, Pexels free tier (or your own clips) for footage, ffmpeg for compositing.
#
# Bound to `compose` — this workflow writes and renders but holds no publishing credential. Upload
# happens separately, after approval, from the publishing environment.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What the Short is about"
        required: true
        default: "why a journal that works in airplane mode matters"
      terms:
        description: "Stock footage search terms"
        required: false
        default: "journal writing calm morning routine"
      script_only:
        description: "Write the script but skip rendering (true/false)"
        required: false
        default: "false"

concurrency:
  group: autoseo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    environment: compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps
        # ffmpeg is not preinstalled on ubuntu-24.04 runners.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache the speech model
        # 88 MB int8 ONNX plus a 28 MB voice pack. Downloading it on every run would dominate the
        # job time for no reason — the files are immutable release assets.
        uses: actions/cache@v4
        with:
          path: state/models
          key: kokoro-v1.0-int8

      - name: Install
        run: pip install -e ".[media]"

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          autoseo restore
          autoseo video \
            --topic "${{ github.event.inputs.topic }}" \
            --terms "${{ github.event.inputs.terms }}" \
            ${{ github.event.inputs.script_only == 'true' && '--script-only' || '--queue' }}
          autoseo snapshot

      - name: Upload the render as an artifact
        if: github.event.inputs.script_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: state/media/short.mp4
          retention-days: 14
          if-no-files-found: warn

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then echo "No state changes."; exit 0; fi
            git commit -q -m "video: $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main 2>/dev/null; then exit 0; fi
            git fetch -q origin main && git reset -q --hard origin/main
            autoseo restore >/dev/null && autoseo snapshot >/dev/null
          done
