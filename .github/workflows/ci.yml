name: ci

# The nightly loop in seo.yml runs whatever is on main, unattended, against the live site. Nothing
# checked that main still worked. Two of the last three failures — a slug the renderer would not
# match, and an exit code that took the ledger down with it — were the kind a test catches in half
# a second, and both were instead found by a red run the next morning.
#
# Deliberately a separate workflow: this gates the code, seo.yml runs the business. A test suite
# bolted into the nightly job would only report a break after the night it broke.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # No network, no database, no credentials — the suite is hermetic on purpose. A test that
      # needs getdailyvox.com to be up goes red for reasons that have nothing to do with the commit.
      - name: Test
        run: pytest -q
