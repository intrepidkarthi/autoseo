name: publish

# Opens PRs on the site repo for drafts approved in Telegram.
#
# Bound to `publishing`, the only environment holding a credential that can change getdailyvox.com.
# That environment has a required reviewer, so every run pauses for explicit approval in the Actions
# UI before the token is even issued. Combined with the Telegram gate and the PR itself, three
# independent checks stand between a draft and the live site — and this one cannot be bypassed by a
# bug in the pipeline.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be published without opening PRs (true/false)"
        required: false
        default: "true"

concurrency:
  group: autoseo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .

      - name: Publish approved drafts
        env:
          GH_DAILYVOX_TOKEN: ${{ secrets.GH_DAILYVOX_TOKEN }}
        run: |
          autoseo restore
          autoseo publish ${{ github.event.inputs.dry_run != 'false' && '--dry-run' || '' }}
          autoseo snapshot

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then echo "No state changes."; exit 0; fi
            git commit -q -m "publish: $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main 2>/dev/null; then exit 0; fi
            git fetch -q origin main && git reset -q --hard origin/main
            autoseo restore >/dev/null && autoseo snapshot >/dev/null
          done
