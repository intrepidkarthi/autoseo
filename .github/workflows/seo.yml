name: seo

# The whole loop, once a day, unattended. Measure, decide, compose, ship.
#
# Two jobs rather than one, and the split is the only structural rule left now that the approval
# gates are gone: `plan` reads the open web and runs the model but holds no credential that can
# change getdailyvox.com; `apply` holds that credential and makes no model calls, reads nothing
# from the open web, and only executes what `plan` already wrote to the ledger. There is no path
# from text the composer read to a commit on the site.
#
# Neither job pauses for a human. `publishing` must therefore have no required reviewer — if one is
# configured, every run will sit waiting in the Actions UI, which is the exact behaviour this was
# built to remove.
#
# To stop the loop without touching this file: create `state/PAUSE` and commit it, or set the
# repository variable AUTOSEO_PAUSE=1.

on:
  schedule:
    # Two firings, and the second one is not a second run — see the `guard` job.
    #
    # GitHub's scheduler is best-effort. An off-boundary minute was the first mitigation, after
    # "30 0 * * *" failed to fire at all on the first night, and it was not enough: on 2026-08-27
    # "37 0 * * *" produced no run either. Not a failure — an absence. No queued run, no cancelled
    # run, nothing in the UI, and a silently skipped day looks exactly like a day with nothing to
    # do. The whole loop is unattended, so a failure mode that leaves no trace is the worst kind.
    #
    # Two changes. The hour moved off 00:xx UTC, which is where every "daily" job in the world
    # piles up and where this one was consistently starting 90 minutes late — a reliable sign of
    # an oversubscribed slot. And a second firing ten hours later recovers the day if the first
    # is dropped again.
    - cron: "13 3 * * *"     # 08:43 IST
    - cron: "41 13 * * *"    # 19:11 IST — catch-up, skipped when the morning run succeeded
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print, change nothing (true/false)"
        required: false
        default: "false"
      days:
        description: "Analysis window in days"
        required: false
        default: "90"
      inspect_limit:
        description: "Sitemap URLs to inspect this run (156 total, quota 2000/day)"
        required: false
        default: "200"
      aeo_tier:
        description: "AEO panel tier: core | extended | all | skip (default: weekly, on Mondays)"
        required: false
        default: ""
      backfill:
        description: "One-time: pull the full 16-month GSC history (true/false)"
        required: false
        default: "false"

concurrency:
  group: autoseo-state
  cancel-in-progress: false

permissions:
  contents: write   # to commit state/ back — this also keeps the 60-day schedule timer alive

jobs:
  # Does this firing have anything to do? Only the catch-up cron can answer "no".
  #
  # Fails OPEN, deliberately and at every branch: an error here must never be able to stop the
  # loop. A dropped run costs one day; a guard that wrongly says "already done" costs every day
  # until someone notices, and nobody is watching — that is the entire premise of this workflow.
  # So the only path that sets proceed=false is the one where GitHub itself confirmed a successful
  # run today.
  guard:
    name: anything to do
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "proceed=true" >> "$GITHUB_OUTPUT"     # the default, overwritten only below

          # A hand-dispatched run is someone asking for it on purpose. Never second-guess that.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual dispatch — proceeding"
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)
          # `.event == "schedule"` matters: this job exists to recover a *dropped scheduled run*,
          # and a hand-dispatched run — a dry run especially — says nothing about whether the
          # morning firing happened. Counting one would suppress the very catch-up it was run to
          # test. Manual runs are orthogonal here, and the per-day caps already stop the real ones
          # from publishing twice.
          runs=$(gh api "/repos/${{ github.repository }}/actions/workflows/seo.yml/runs?status=success&per_page=30" \
                   --jq "[.workflow_runs[] | select(.event == \"schedule\" and (.created_at | startswith(\"$today\")))] | length" 2>/dev/null) || {
            echo "::warning::could not read today's runs — proceeding rather than risk skipping a day"
            exit 0
          }
          case "$runs" in
            ''|*[!0-9]*) echo "::warning::unreadable run count '$runs' — proceeding"; exit 0 ;;
          esac

          if [ "$runs" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$runs successful run(s) already today — nothing to catch up"
          else
            echo "no successful run yet today — proceeding"
          fi

  plan:
    name: measure and compose
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Measure, decide, compose
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTOSEO_INSPECT_LIMIT: ${{ github.event.inputs.inspect_limit || '200' }}
          AUTOSEO_PAUSE: ${{ vars.AUTOSEO_PAUSE }}
          DAYS: ${{ github.event.inputs.days || '90' }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          set -e
          autoseo restore

          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            autoseo gsc --backfill
          fi

          autoseo inventory
          autoseo collect

          # The AEO panel costs a few minutes of free-tier quota and moves slowly. Weekly is
          # enough to keep the outreach list current; the input overrides it on demand.
          #
          # Two days, not one, and the second is what keeps the composer supplied. `core` alone is
          # ten questions, and by 2026-08-29 the loop had written an article for every gap they
          # surfaced — the answer-engine arm then produced nothing for three days while twelve
          # `extended` questions sat in panel.yaml having never been asked once. A gap pool that
          # never refills is a pool that empties.
          #
          # `frontier` stays out of the rotation on purpose (see cli.py): it measures a cluster the
          # site has no foothold in, which is a strategy question, not a trend. That is why this
          # names the tiers rather than using `all`.
          #
          # Quota: (10 core + 12 extended) x 3 repeats = 66 calls/week, ~290/month against the
          # 5,000/month free grounded allowance.
          TIER="${{ github.event.inputs.aeo_tier }}"
          if [ -z "$TIER" ] && [ "$(date -u +%u)" = "1" ]; then TIER=core; fi
          if [ -z "$TIER" ] && [ "$(date -u +%u)" = "4" ]; then TIER=extended; fi
          if [ -n "$TIER" ] && [ "$TIER" != "skip" ]; then
            autoseo aeo --tier "$TIER" || echo "::warning::AEO panel failed — continuing"
            autoseo outreach || true
          fi

          autoseo brief
          autoseo plan --days "$DAYS" $DRY
          autoseo status

          # What happened to what we already shipped. Observational for now — nothing downstream
          # reads it, and a policy steering on two matured data points would be worse than one
          # steering on none. It runs daily anyway so the record accumulates in the log from the
          # start, and `|| true` because a measurement failing must never fail the run that
          # produced the thing being measured.
          autoseo grade || true

          autoseo snapshot

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"

          # Concurrent runs both write state/*.csv, and git cannot merge them — an earlier attempt
          # at `pull --rebase` hit a CSV conflict and left a detached HEAD. But the database CAN
          # merge: `restore` upserts, so loading the remote snapshot into our db produces the union
          # of both sides. So on rejection we take the remote files, re-merge through the app, and
          # re-snapshot. The db is gitignored, so `reset --hard` never touches the rows being saved.
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then
              echo "No state changes."
              exit 0
            fi
            git commit -q -m "plan: $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "state pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — merging remote state through the database"
            git fetch -q origin main
            git reset -q --hard origin/main
            autoseo restore >/dev/null
            autoseo snapshot >/dev/null
          done
          echo "::warning::could not push state after 3 attempts; it will merge on the next run"

      - name: Hand the ledger to the apply job
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: state/*.csv
          retention-days: 7

  apply:
    name: commit to the site
    needs: plan
    runs-on: ubuntu-latest
    environment: publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # Taken from the artifact rather than from the checkout: if the plan job could not push its
      # state (a concurrent run, a rejected push), main does not yet contain the items about to be
      # applied, and applying nothing would look identical to having nothing to apply.
      - name: Take the ledger from the plan job
        uses: actions/download-artifact@v4
        with:
          name: state
          path: state

      # Catch up to whatever `plan` pushed BEFORE doing any work, so this job's own commit is a
      # fast-forward and the retry path below never has to run. `needs: plan` guarantees that push
      # already happened; the checkout above pinned an older SHA, which is what made every apply
      # commit a non-fast-forward and sent it into a merge it could not do correctly.
      - name: Catch up to main
        run: |
          git fetch -q origin main
          git reset -q --hard origin/main

      - name: Take the ledger from the plan job
        uses: actions/download-artifact@v4
        with:
          name: state
          path: state

      - name: Apply
        id: apply
        env:
          GH_DAILYVOX_TOKEN: ${{ secrets.GH_DAILYVOX_TOKEN }}
          AUTOSEO_PAUSE: ${{ vars.AUTOSEO_PAUSE }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          set -e
          autoseo restore

          # `apply` exits non-zero when an item failed. That is a report, not a reason to stop.
          # Items are applied independently and the ones that shipped are recorded as they go — but
          # the database is gitignored, so those rows exist only until `snapshot` writes them out
          # and the step below pushes them. Ending the shell here throws them away.
          #
          # On 2026-08-26 that is exactly what happened: one draft carried a slug the renderer
          # would not match, `set -e` killed the job on the spot, and the prune that had already
          # shipped that night went back to `planned` because nothing after this line ran. The
          # ledger and the site disagreed about what was on the site — the failure this job's own
          # commit step is written to avoid, arriving through the one door it was not watching.
          #
          # So carry the code to the end of the job and fail there, after the ledger is safe.
          rc=0
          autoseo apply $DRY || rc=$?
          autoseo snapshot
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"

          # The retry path here is NOT the one in the plan job, and the difference matters.
          #
          # `restore` upserts, so loading a remote snapshot into the database produces the union of
          # both sides — true for the measurement tables, which only ever gain rows. It is false for
          # `queue_item`, whose rows are mutable: the remote holds an OLDER version of the same
          # primary key, and INSERT OR REPLACE overwrites the newer local one. That is exactly what
          # happened on the first live run. Five items shipped to the site, `apply` recorded all
          # five, the push was rejected, this loop reset to the remote and restored — and every
          # `shipped` reverted to `planned`. The site had the commits; the ledger had no memory of
          # making them, so the caps miscounted and the next run tried to publish it all again.
          #
          # So: remote first, ours second. Ours wins on conflicting keys, remote-only rows survive.
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then echo "No state changes."; exit 0; fi
            git commit -q -m "apply: $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "state pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — replaying our decisions on top of the remote state"
            mine=$(mktemp -d) && cp state/*.csv "$mine/"
            git fetch -q origin main
            git reset -q --hard origin/main
            autoseo restore >/dev/null          # database := remote
            cp "$mine"/*.csv state/
            autoseo restore >/dev/null          # ours on top; ours wins per primary key
            autoseo snapshot >/dev/null
          done
          echo "::error::could not push state after 3 attempts — the ledger and the site now"
          echo "::error::disagree about what shipped. Re-run this job before the next cycle."
          exit 1

      # Deliberately the last step. An item that failed still has to turn the run red — someone has
      # to look at it — but not before the record of what shipped alongside it has been pushed.
      - name: Report failed items
        if: steps.apply.outputs.rc != '0'
        run: |
          echo "::error::autoseo apply reported at least one failed item — see the Apply step log."
          echo "::error::The ledger has been committed, so the items that shipped are recorded and"
          echo "::error::the failed one is marked failed rather than retried on the next cycle."
          exit 1
