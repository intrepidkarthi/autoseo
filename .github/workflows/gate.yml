name: gate

# The approval loop. Polls Telegram for button taps and delivers any queued cards.
#
# Separate from `collect` on purpose: collection is a once-a-day job that takes ~20 minutes, while
# approvals should feel responsive. Running this every 20 minutes costs seconds and keeps latency
# to at most one interval, which is irrelevant for content scheduled hours ahead.
#
# Bound to `compose`, which holds no publishing credential — this workflow can read decisions and
# send messages, but cannot post anything anywhere.

on:
  # Primary path: the Cloudflare worker forwards each Telegram update the instant it arrives.
  repository_dispatch:
    types: [telegram_update]

  # Safety net. With a webhook registered getUpdates returns 409, so this no longer collects
  # decisions — it exists to deliver any cards queued by other jobs and to prove the gate still
  # runs. GitHub honours this roughly hourly regardless of the interval requested.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      test_card:
        description: "Send one test card to verify delivery (true/false)"
        required: false
        default: "false"
      raw:
        description: "Dump pending Telegram updates without consuming them (true/false)"
        required: false
        default: "false"
      queue_outreach:
        description: "Draft pitches for the top N outreach targets (0 = skip)"
        required: false
        default: "0"

concurrency:
  group: autoseo-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .

      - name: Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPATCHED_UPDATE: ${{ toJSON(github.event.client_payload.update) }}
        run: |
          autoseo restore
          if [ "${{ github.event.inputs.raw }}" = "true" ]; then
            autoseo gate --raw
            exit 0
          fi
          if [ -n "$DISPATCHED_UPDATE" ] && [ "$DISPATCHED_UPDATE" != "null" ]; then
            autoseo gate --update "$DISPATCHED_UPDATE"
          else
            autoseo gate \
              ${{ github.event.inputs.test_card == 'true' && '--test-card' || '' }} \
              --queue-outreach ${{ github.event.inputs.queue_outreach || '0' }}
          fi
          autoseo snapshot

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"

          # Concurrent runs (a dispatch and a cron tick) both write state/*.csv, and git cannot
          # merge them — an earlier attempt at `pull --rebase` hit a CSV conflict and left a
          # detached HEAD. But the database CAN merge: `restore` upserts, so loading the remote
          # snapshot into our db produces the union of both sides. So on rejection we take the
          # remote files, re-merge through the app, and re-snapshot. The db is gitignored, so
          # `reset --hard` never touches the rows we are trying to save.
          for attempt in 1 2 3; do
            git add -A state/
            if git diff --staged --quiet; then
              echo "No state changes."
              exit 0
            fi
            git commit -q -m "gate: decisions $(date -u +%Y-%m-%dT%H:%M)"
            if git push -q origin HEAD:main 2>/dev/null; then
              echo "state pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — merging remote state through the database"
            git fetch -q origin main
            git reset -q --hard origin/main
            autoseo restore >/dev/null
            autoseo snapshot >/dev/null
          done
          echo "::warning::could not push state after 3 attempts; it will merge on the next run"
