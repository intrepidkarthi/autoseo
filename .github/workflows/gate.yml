name: gate

# The approval loop. Polls Telegram for button taps and delivers any queued cards.
#
# Separate from `collect` on purpose: collection is a once-a-day job that takes ~20 minutes, while
# approvals should feel responsive. Running this every 20 minutes costs seconds and keeps latency
# to at most one interval, which is irrelevant for content scheduled hours ahead.
#
# Bound to `compose`, which holds no publishing credential — this workflow can read decisions and
# send messages, but cannot post anything anywhere.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      test_card:
        description: "Send one test card to verify delivery (true/false)"
        required: false
        default: "false"
      queue_outreach:
        description: "Draft pitches for the top N outreach targets (0 = skip)"
        required: false
        default: "0"

concurrency:
  group: gate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: compose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .

      - name: Gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          autoseo restore
          autoseo gate \
            ${{ github.event.inputs.test_card == 'true' && '--test-card' || '' }} \
            --queue-outreach ${{ github.event.inputs.queue_outreach || '0' }}
          autoseo snapshot

      - name: Commit state
        run: |
          git config user.name  "autoseo[bot]"
          git config user.email "autoseo@users.noreply.github.com"
          git add -A state/
          if git diff --staged --quiet; then
            echo "No decisions this run."
          else
            git commit -m "gate: decisions $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash -q origin main || true
            git push
          fi
