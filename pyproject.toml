[project]
name = "autoseo"
version = "0.1.0"
description = "Autonomous SEO for DailyVox: measure, decide, fix, publish — no approval step"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# pyyaml is a test dependency: tests/test_workflow.py asserts on the nightly
# workflow's own structure, which is where two production failures actually lived.
dev = ["pytest>=8.0", "ruff>=0.6", "pyyaml>=6.0"]
# Heavy and only needed when rendering video, so kept out of the default install: every other
# workflow would otherwise pay ~200 MB of onnxruntime on each run.
media = ["kokoro-onnx>=0.4", "numpy>=1.26", "soundfile>=0.12"]
# Only for the one-time local YouTube consent flow; CI never runs it.
auth = ["google-auth-oauthlib>=1.2"]

[project.scripts]
autoseo = "autoseo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoseo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
# Vendored code is copied byte-for-byte so it can be re-copied wholesale on upgrade. Linting it
# would produce fixes that make the next re-copy a merge.
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
