<title>autoseo — getdailyvox.com</title>
<style>
  /* A console, not a report. Flat surfaces and hairlines rather than floating cards, dense rows,
     one accent that means "selected" and nothing else. Numerals are monospaced everywhere they can
     be compared down a column. No webfonts — the artifact CSP blocks font hosts and a silent
     fallback is worse than an honest system stack. */
  :root {
    --bg: #ffffff; --panel: #ffffff; --alt: #f7f8f7;
    --line: #dcdfdb; --line-2: #edefec;
    --ink: #151a17; --ink-2: #495049; --muted: #767e77;
    --sel: #1a6ec0; --sel-soft: #eaf2fc;
    --c-clicks: #2a78d6; --c-impr: #eb6834; --c-ctr: #1baf7a; --c-pos: #7b5ea7;
    --bad: #c0392f; --ok: #1baf7a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101311; --panel: #161a17; --alt: #1b201d;
      --line: #2b312d; --line-2: #21261f;
      --ink: #eef1ed; --ink-2: #bcc4bd; --muted: #838c85;
      --sel: #6aa9ee; --sel-soft: #17293c;
      --c-clicks: #3987e5; --c-impr: #d95926; --c-ctr: #199e70; --c-pos: #9c86c9;
      --bad: #e66767; --ok: #199e70;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101311; --panel: #161a17; --alt: #1b201d;
    --line: #2b312d; --line-2: #21261f;
    --ink: #eef1ed; --ink-2: #bcc4bd; --muted: #838c85;
    --sel: #6aa9ee; --sel-soft: #17293c;
    --c-clicks: #3987e5; --c-impr: #d95926; --c-ctr: #199e70; --c-pos: #9c86c9;
    --bad: #e66767; --ok: #199e70;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --panel: #ffffff; --alt: #f7f8f7;
    --line: #dcdfdb; --line-2: #edefec;
    --ink: #151a17; --ink-2: #495049; --muted: #767e77;
    --sel: #1a6ec0; --sel-soft: #eaf2fc;
    --c-clicks: #2a78d6; --c-impr: #eb6834; --c-ctr: #1baf7a; --c-pos: #7b5ea7;
    --bad: #c0392f; --ok: #1baf7a;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px;
         line-height: 1.5; margin: 0; padding: 0 0 60px; -webkit-font-smoothing: antialiased; }
  .page { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* Title bar */
  .top { border-bottom: 1px solid var(--line); }
  .top .page { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline;
               justify-content: space-between; padding-top: 18px; padding-bottom: 14px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h1 b { color: var(--muted); font-weight: 400; }
  .stamp { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* Toolbar */
  .toolbar { border-bottom: 1px solid var(--line); background: var(--alt); }
  .toolbar .page { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
                   padding-top: 10px; padding-bottom: 10px; }
  .fgroup { display: flex; align-items: center; gap: 7px; }
  .flabel { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; padding: 4px 11px; background: var(--panel);
                color: var(--ink-2); border: 0; border-right: 1px solid var(--line); cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--sel); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
  input[type="search"] { font: inherit; font-size: 12.5px; padding: 4px 9px; min-width: 190px;
      border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  input[type="search"]:focus-visible { outline: 2px solid var(--sel); outline-offset: -1px; }
  .spacer { flex: 1 1 auto; }
  .rowcount { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* Metric tiles — click to add/remove a series from the chart */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
             border-bottom: 1px solid var(--line); }
  @media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, 1fr); } }
  .metric { position: relative; text-align: left; font: inherit; cursor: pointer; padding: 13px 16px 15px;
            background: var(--panel); border: 0; border-right: 1px solid var(--line-2);
            border-top: 3px solid transparent; display: flex; flex-direction: column; gap: 3px; }
  .metric:last-child { border-right: 0; }
  .metric[aria-pressed="true"] { background: var(--alt); }
  .metric:focus-visible { outline: 2px solid var(--sel); outline-offset: -3px; }
  .metric .k { font-size: 11.5px; color: var(--muted); letter-spacing: 0.03em; }
  .metric .v { font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums;
               letter-spacing: -0.02em; line-height: 1.15; }
  .metric .d { font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--muted); }
  .metric[data-m="clicks"]      { border-top-color: transparent; }
  .metric[data-m="clicks"][aria-pressed="true"]      { border-top-color: var(--c-clicks); }
  .metric[data-m="impressions"][aria-pressed="true"] { border-top-color: var(--c-impr); }
  .metric[data-m="ctr"][aria-pressed="true"]         { border-top-color: var(--c-ctr); }
  .metric[data-m="position"][aria-pressed="true"]    { border-top-color: var(--c-pos); }

  /* Chart */
  .chartwrap { border-bottom: 1px solid var(--line); padding: 14px 0 6px; position: relative; }
  .panelrow + .panelrow { margin-top: 10px; }
  /* In normal flow, not absolutely positioned: at left:0 it sat on top of the y-axis tick labels. */
  .plab { display: block; font-size: 11px; font-family: var(--mono); margin: 0 0 2px 2px;
          letter-spacing: 0.02em; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid { stroke: var(--line-2); }
  .axis { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); }
  .subset { font-size: 12px; color: var(--ink-2); background: var(--sel-soft);
            border-left: 3px solid var(--sel); padding: 7px 11px; margin: 10px 0 2px; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink);
         border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; font-size: 12px;
         font-family: var(--mono); white-space: nowrap; opacity: 0; transition: opacity .1s;
         box-shadow: 0 2px 10px rgba(0,0,0,.14); z-index: 5; }
  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }

  /* Tabs + tables */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-top: 26px; }
  .tabs button { font: inherit; font-size: 13px; padding: 9px 16px; background: none; border: 0;
                 border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sel); font-weight: 600; }
  .tabs button:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th { position: sticky; top: 0; background: var(--bg); z-index: 1; text-align: left;
             font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
             font-weight: 600; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line);
             cursor: pointer; white-space: nowrap; user-select: none; }
  thead th:focus-visible { outline: 2px solid var(--sel); outline-offset: -2px; }
  thead th.n, td.n { text-align: right; }
  thead th .arrow { color: var(--sel); }
  td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line-2); vertical-align: baseline; }
  tbody tr:hover { background: var(--alt); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .txt { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 10.5px; font-family: var(--mono); padding: 1px 6px; border-radius: 3px;
         border: 1px solid var(--line); color: var(--muted); }
  .tag.acquisition { color: var(--c-clicks); border-color: currentColor; }
  .tag.brand { color: var(--c-impr); border-color: currentColor; }
  .warn { color: var(--bad); font-weight: 600; }
  .empty { padding: 26px 0; color: var(--muted); }

  h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
       color: var(--muted); margin: 30px 0 10px; }

  /* Strategy panel */
  .strat { border: 1px solid var(--line); border-left: 3px solid var(--sel); margin: 18px 0 22px; }
  .strat .hd { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
               padding: 11px 16px; border-bottom: 1px solid var(--line-2); background: var(--alt); }
  .strat .hd h3 { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
                  margin: 0; color: var(--ink); }
  .strat .hd .st { font-family: var(--mono); font-size: 11.5px; }
  .strat .bd { display: grid; grid-template-columns: 1.35fr 1fr; gap: 0; }
  @media (max-width: 860px) { .strat .bd { grid-template-columns: 1fr; } }
  .strat .col { padding: 13px 16px 15px; }
  .strat .col + .col { border-left: 1px solid var(--line-2); }
  @media (max-width: 860px) { .strat .col + .col { border-left: 0; border-top: 1px solid var(--line-2); } }
  .strat h4 { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);
              margin: 0 0 8px; font-weight: 700; }
  .rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .rules li { font-size: 12.5px; color: var(--ink-2); padding-left: 15px; position: relative; }
  .rules li::before { content: "—"; position: absolute; left: 0; color: var(--muted); }
  .rules li b { color: var(--ink); font-weight: 600; }
  .goal { font-size: 12.5px; color: var(--ink-2); margin: 0 0 10px; }
  .verdict { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono);
             font-size: 12px; padding: 3px 9px; border: 1px solid currentColor; border-radius: 3px; }
  .verdict.hold { color: var(--ok); } .verdict.slip { color: var(--bad); }
  .bars { display: flex; flex-direction: column; gap: 8px; margin-top: 11px; }
  .cap { display: grid; grid-template-columns: 118px 1fr 54px; gap: 9px; align-items: center;
         font-size: 12px; }
  .cap .track { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
  .cap .fill { height: 100%; background: var(--sel); }
  .cap .n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right;
            color: var(--muted); font-size: 11.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0;
        border-bottom: 1px solid var(--line-2); font-size: 13px; }
  .kv b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
  footer { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line);
           font-size: 12px; color: var(--muted); max-width: 78ch; }
  code { font-family: var(--mono); font-size: 0.92em; }
</style>

<div class="top"><div class="page">
  <h1>autoseo <b>· getdailyvox.com · Search performance</b></h1>
  <div class="stamp" id="stamp"></div>
</div></div>

<div class="toolbar"><div class="page">
  <div class="fgroup"><span class="flabel">Range</span>
    <div class="seg" id="range" role="group" aria-label="Date range"></div>
  </div>
  <div class="fgroup"><span class="flabel">Intent</span>
    <div class="seg" id="intent" role="group" aria-label="Search intent"></div>
  </div>
  <div class="fgroup"><span class="flabel">Filter</span>
    <input type="search" id="q" placeholder="query or page contains…" aria-label="Filter rows">
  </div>
  <span class="spacer"></span>
  <span class="rowcount" id="rowcount"></span>
</div></div>

<div class="page">
  <section class="strat" id="strat"></section>
  <div class="metrics" id="metrics"></div>
  <div class="chartwrap">
    <div id="charts"></div>
    <div class="tip" id="tip"></div>
  </div>
  <div id="subset"></div>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="scroll"><table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
  <div class="empty" id="empty" hidden>No rows match these filters.</div>

  <div class="grid2">
    <div>
      <h2>Answer engines</h2>
      <div id="aeo"></div>
    </div>
    <div>
      <h2>Loop activity — last 30 days</h2>
      <div id="loop"></div>
    </div>
  </div>

  <h2>Striking distance — page average versus the query that matters</h2>
  <div class="scroll"><table>
    <thead><tr>
      <th>Page</th><th>Best acquisition query</th><th class="n">Impr.</th>
      <th class="n">Clicks</th><th class="n">Page avg</th><th class="n">Real rank</th>
    </tr></thead>
    <tbody id="striking"></tbody>
  </table></div>

  <footer id="footer"></footer>
</div>

<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const n0 = x => Math.round(x).toLocaleString();
const f2 = x => x.toFixed(2);

/* ---- state ------------------------------------------------------------- */
const MAXD = D.daily.length ? D.daily[D.daily.length - 1].d : null;
const RANGES = [['7d', 7], ['28d', 28], ['3mo', 90], ['All', 9999]];
const INTENTS = [['All', 'all'], ['Acquisition', 'acquisition'], ['Brand', 'brand'],
                 ['Other', 'other']];
const METRICS = {
  clicks:      { label: 'Total clicks',      color: '--c-clicks', fmt: n0 },
  impressions: { label: 'Total impressions', color: '--c-impr',   fmt: n0 },
  ctr:         { label: 'Average CTR',       color: '--c-ctr',    fmt: v => v.toFixed(2) + '%' },
  position:    { label: 'Average position',  color: '--c-pos',    fmt: v => v.toFixed(1) },
};
const S = { days: 28, intent: 'all', text: '', on: new Set(['clicks', 'impressions']), tab: 'queries',
            sort: { key: 'i', dir: -1 } };

const shiftDays = (iso, n) => {
  const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
};
const from = () => S.days >= 9999 ? '0000-01-01' : shiftDays(MAXD, -S.days + 1);
const inRange = r => r.d >= from() && r.d <= MAXD;
const bucket = k => k === 'acquisition' || k === 'brand' ? k : 'other';
const matchIntent = r => S.intent === 'all' || bucket(r.k) === S.intent;
const matchText = t => !S.text || t.toLowerCase().includes(S.text);

/* Aggregate rows into one record per key. Position is impression-weighted; a plain mean would let
   a two-impression page outvote a nine-hundred-impression one. */
function agg(rows, keyfn) {
  const m = new Map();
  for (const r of rows) {
    const k = keyfn(r);
    let a = m.get(k);
    if (!a) m.set(k, a = { key: k, c: 0, i: 0, w: 0, k2: r.k });
    a.c += r.c; a.i += r.i; a.w += (r.p || 0) * r.i;
  }
  for (const a of m.values()) {
    a.p = a.i ? a.w / a.i : 0;
    a.ctr = a.i ? a.c / a.i * 100 : 0;
  }
  return [...m.values()];
}

/* The series behind the chart. With no intent filter this is the authoritative page-level total;
   filtered, it can only come from the query dimension, which GSC populates for part of the traffic.
   Switching filters therefore changes the *coverage* as well as the slice, and pretending otherwise
   would show a cliff that is an artefact. The banner says which source is in play. */
function series() {
  if (S.intent === 'all' && !S.text) {
    return { rows: agg(D.daily.filter(inRange), r => r.d), subset: false };
  }
  const rows = D.queries.filter(r => inRange(r) && matchIntent(r) && matchText(r.q));
  return { rows: agg(rows, r => r.d), subset: true };
}

function totals(rows) {
  const t = rows.reduce((a, r) => ({ c: a.c + r.c, i: a.i + r.i, w: a.w + r.p * r.i }),
                        { c: 0, i: 0, w: 0 });
  return { clicks: t.c, impressions: t.i, ctr: t.i ? t.c / t.i * 100 : 0,
           position: t.i ? t.w / t.i : 0 };
}

/* ---- controls ---------------------------------------------------------- */
function segment(el, items, get, set) {
  el.innerHTML = items.map(([label, v]) =>
    `<button type="button" data-v="${v}" aria-pressed="${get() === v}">${label}</button>`).join('');
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    set(isNaN(b.dataset.v) ? b.dataset.v : +b.dataset.v);
    [...el.children].forEach(c => c.setAttribute('aria-pressed', c === b));
    render();
  };
}
segment($('range'), RANGES, () => S.days, v => S.days = v);
segment($('intent'), INTENTS, () => S.intent, v => S.intent = v);
$('q').oninput = e => { S.text = e.target.value.trim().toLowerCase(); render(); };

/* ---- metric tiles ------------------------------------------------------ */
function drawMetrics() {
  const cur = totals(series().rows);
  // Previous window of equal length, same filters, for the delta.
  const prevFrom = shiftDays(from(), -S.days), prevTo = shiftDays(from(), -1);
  const prevRows = (S.intent === 'all' && !S.text ? D.daily : D.queries)
    .filter(r => r.d >= prevFrom && r.d <= prevTo &&
                 (S.intent === 'all' || matchIntent(r)) && (!S.text || matchText(r.q || r.u || '')));
  const prev = totals(agg(prevRows, r => r.d));

  $('metrics').innerHTML = Object.entries(METRICS).map(([id, m]) => {
    const v = cur[id], pv = prev[id];
    let chip = '<span class="d flat">—</span>';
    if (pv) {
      if (id === 'position') {
        const mv = v - pv;
        chip = `<span class="d ${Math.abs(mv) < 0.3 ? 'flat' : mv > 0 ? 'down' : 'up'}">`
             + `${mv > 0 ? '+' : ''}${mv.toFixed(1)} places</span>`;
      } else {
        const pct = (v - pv) / pv * 100;
        chip = `<span class="d ${Math.abs(pct) < 3 ? 'flat' : pct > 0 ? 'up' : 'down'}">`
             + `${pct > 0 ? '+' : ''}${pct.toFixed(0)}%</span>`;
      }
    }
    return `<button type="button" class="metric" data-m="${id}" aria-pressed="${S.on.has(id)}">
      <span class="k">${m.label}</span><span class="v">${m.fmt(v || 0)}</span>${chip}</button>`;
  }).join('');
  $('metrics').onclick = e => {
    const b = e.target.closest('.metric'); if (!b) return;
    const id = b.dataset.m;
    if (S.on.has(id)) { if (S.on.size > 1) S.on.delete(id); } else S.on.add(id);
    render();
  };
}

/* ---- chart ------------------------------------------------------------- */
/* One panel per selected metric, stacked and sharing an x-axis. GSC overlays them on two y-axes;
   that is the one chart convention worth breaking with it, because two scales on one frame invents
   crossings and gaps that exist in the drawing and not in the data. Stacked panels answer the same
   question — how do these move together — without the invented relationship. */
function drawCharts() {
  const { rows, subset } = series();
  rows.sort((a, b) => a.key < b.key ? -1 : 1);
  const sel = [...S.on];
  const W = 1140, H = sel.length > 2 ? 96 : 132, pad = { t: 12, r: 8, b: 18, l: 46 };

  $('charts').innerHTML = sel.map(id => {
    const m = METRICS[id], c = css(m.color);
    const vals = rows.map(r => id === 'ctr' ? r.ctr : id === 'position' ? r.p : r[id === 'clicks' ? 'c' : 'i']);
    const lo = id === 'position' ? 0 : 0;
    const hi = Math.max(...vals, id === 'ctr' ? 1 : 1) * 1.18;
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const x = i => pad.l + (rows.length < 2 ? iw / 2 : i * iw / (rows.length - 1));
    // Position is a rank: 1 belongs at the top, so its scale is inverted.
    const y = v => id === 'position'
      ? pad.t + (v - lo) / (hi - lo) * ih
      : pad.t + ih - (v - lo) / (hi - lo) * ih;
    const pts = vals.map((v, i) => [x(i), y(v)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const fill = rows.length > 1
      ? `${line} L${pts[pts.length - 1][0].toFixed(1)} ${id === 'position' ? pad.t : pad.t + ih} L${pts[0][0].toFixed(1)} ${id === 'position' ? pad.t : pad.t + ih} Z` : '';
    // Deduplicated by rendered label: on a range of 0–1 clicks the midpoint formats to the same
    // "1" as the top, and an axis reading 1 / 1 / 0 looks like a bug because it is one.
    const seen = new Set();
    const ticks = [0, 0.5, 1].map(f => {
      const v = lo + (hi - lo) * f;
      const label = m.fmt(v);
      if (seen.has(label)) return '';
      seen.add(label);
      return `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>
        <text class="axis" x="${pad.l - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${label}</text>`;
    }).join('');
    const step = Math.max(1, Math.ceil(rows.length / 8));
    const xlabels = rows.map((r, i) => (i % step === 0 || i === rows.length - 1)
      ? `<text class="axis" x="${x(i).toFixed(1)}" y="${H - 5}" text-anchor="middle">${r.key.slice(5)}</text>` : '').join('');
    const dots = rows.length <= 40 ? vals.map((v, i) =>
      `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${c}"/>`).join('') : '';
    return `<div class="panelrow"><span class="plab" style="color:${c}">${m.label}</span>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${m.label} over time">
        ${ticks}${fill ? `<path d="${fill}" fill="${c}" opacity="0.09"/>` : ''}
        <path d="${line}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/>
        ${dots}${xlabels}
        <line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" stroke="${c}"
              stroke-width="1" opacity="0" />
      </svg></div>`;
  }).join('');

  $('subset').innerHTML = subset
    ? `<div class="subset"><b>Query-attributed subset.</b> Intent and text filters can only be
       applied to the query dimension, which Search Console populates for
       ${D.composition.coverage.toFixed(0)}% of clicks — the rest is anonymised. These lines describe
       that subset, not the whole site; clear the filters for authoritative totals.</div>` : '';

  attachHover(rows);
}

/* Crosshair + tooltip across every stacked panel at once. */
function attachHover(rows) {
  const wrap = $('charts'), tip = $('tip');
  if (!rows.length) return;
  wrap.onmousemove = e => {
    const box = wrap.getBoundingClientRect();
    const pad = { l: 46, r: 8 };
    const frac = (e.clientX - box.left - pad.l * box.width / 1140) /
                 ((1140 - pad.l - pad.r) * box.width / 1140);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(frac * (rows.length - 1))));
    const r = rows[i];
    tip.innerHTML = `${r.key}<br>clicks ${n0(r.c)} · impr ${n0(r.i)}`
      + `<br>ctr ${r.ctr.toFixed(2)}% · pos ${r.p.toFixed(1)}`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(box.width - tw - 6, Math.max(4, e.clientX - box.left + 12)) + 'px';
    tip.style.top = (e.clientY - box.top + 12) + 'px';
    wrap.querySelectorAll('svg').forEach(svg => {
      const c = svg.querySelector('.cross');
      const xp = 46 + (rows.length < 2 ? (1140 - 54) / 2 : i * (1140 - 54) / (rows.length - 1));
      c.setAttribute('x1', xp); c.setAttribute('x2', xp); c.setAttribute('opacity', '0.45');
    });
  };
  wrap.onmouseleave = () => {
    tip.style.opacity = 0;
    wrap.querySelectorAll('.cross').forEach(c => c.setAttribute('opacity', '0'));
  };
}

/* ---- tables ------------------------------------------------------------ */
const TABS = [['Queries', 'queries'], ['Pages', 'pages']];
const COLS = {
  queries: [['Query', 'key', 0], ['Intent', 'k2', 0], ['Clicks', 'c', 1],
            ['Impressions', 'i', 1], ['CTR', 'ctr', 1], ['Position', 'p', 1]],
  pages:   [['Page', 'key', 0], ['Clicks', 'c', 1], ['Impressions', 'i', 1],
            ['CTR', 'ctr', 1], ['Position', 'p', 1]],
};
$('tabs').innerHTML = TABS.map(([l, v]) =>
  `<button type="button" role="tab" data-v="${v}" aria-selected="${S.tab === v}">${l}</button>`).join('');
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  S.tab = b.dataset.v; S.sort = { key: 'i', dir: -1 };
  [...$('tabs').children].forEach(c => c.setAttribute('aria-selected', c === b));
  render();
};

function tableRows() {
  if (S.tab === 'queries') {
    const rows = D.queries.filter(r => inRange(r) && matchIntent(r) && matchText(r.q));
    return agg(rows, r => r.q);
  }
  // Pages carry no intent of their own, so an intent filter cannot apply to them honestly.
  const rows = D.pages.filter(r => inRange(r) && matchText(r.u));
  return agg(rows, r => r.u);
}

function drawTable() {
  const cols = COLS[S.tab];
  $('thead').innerHTML = cols.map(([label, key, num]) => {
    const active = S.sort.key === key;
    return `<th class="${num ? 'n' : ''}" data-k="${key}" tabindex="0"
      aria-sort="${active ? (S.sort.dir < 0 ? 'descending' : 'ascending') : 'none'}">${label}`
      + (active ? ` <span class="arrow">${S.sort.dir < 0 ? '▼' : '▲'}</span>` : '') + '</th>';
  }).join('');
  const sortBy = (k) => { S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: -1 }; render(); };
  $('thead').onclick = e => { const th = e.target.closest('th'); if (th) sortBy(th.dataset.k); };
  $('thead').onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const th = e.target.closest('th'); if (th) { e.preventDefault(); sortBy(th.dataset.k); }
  };

  let rows = tableRows();
  const k = S.sort.key, dir = S.sort.dir;
  rows.sort((a, b) => {
    const av = a[k], bv = b[k];
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    return dir * ((av || 0) - (bv || 0));
  });
  const shown = rows.slice(0, 200);
  $('empty').hidden = rows.length > 0;
  $('rowcount').textContent = rows.length
    ? `${n0(shown.length)} of ${n0(rows.length)} ${S.tab}` : '';

  $('tbody').innerHTML = shown.map(r => {
    const cells = cols.map(([, key, num]) => {
      if (key === 'key') return `<td class="txt" title="${r.key}">${r.key}</td>`;
      if (key === 'k2') return `<td><span class="tag ${bucket(r.k2)}">${bucket(r.k2)}</span></td>`;
      const v = key === 'ctr' ? r.ctr.toFixed(2) + '%'
              : key === 'p' ? r.p.toFixed(1) : n0(r[key]);
      return `<td class="n mono">${v}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
}

/* ---- strategy ---------------------------------------------------------- */
/* The rules are quoted from where they are enforced, and the numbers in them come from
   act/policy.py, so a cap change moves this panel too. The scored goal is the repo's own: daily
   publishing was allowed on the condition that it must not cost indexation. */
const T = D.strategy, IX = T.indexation;
const cap = (label, used, max) => `<div class="cap"><span>${label}</span>
  <span class="track"><span class="fill" style="width:${Math.min(100, max ? used / max * 100 : 0)}%"></span></span>
  <span class="n">${used}/${max}</span></div>`;
$('strat').innerHTML = `
  <div class="hd">
    <h3>Content strategy in force</h3>
    <span class="st ${T.paused ? 'down' : 'up'}">${T.paused ? 'PAUSED — ' + T.paused : 'running · unattended · 06:07 IST daily'}</span>
  </div>
  <div class="bd">
    <div class="col">
      <h4>The rules the loop operates under</h4>
      <ul class="rules">
        <li><b>Fix what already ranks before writing anything new.</b> Pages holding real impressions
          off page one are edited first; a new post is only justified where demand exists and no page
          owns it.</li>
        <li><b>Subtract in the same run that adds.</b> Dead clusters are noindexed and dropped from
          the sitemaps as posts ship, so the corpus does not grow faster than Google will index it.</li>
        <li><b>Volume is explicitly not the objective.</b> The site is still recovering from 1,507
          templated pages that earned one click between them.</li>
        <li><b>Only acquisition intent counts.</b> Brand and framework-identifier queries are
          excluded from targeting — they convert nothing and flatter every average.</li>
        <li><b>One page, once a month.</b> A ${T.caps.cooldown_days}-day cooldown per page, because
          search takes weeks to react and daily rewrites measure nothing.</li>
      </ul>
    </div>
    <div class="col">
      <h4>The goal it is scored against</h4>
      <p class="goal">Publishing was raised to ${T.caps.posts_per_day}/day on one written condition:
        it must not cost indexation. <em>“If that ratio falls over the next few weeks, this number is
        the one to move.”</em> That is the commitment being measured — not a traffic target.</p>
      <span class="verdict ${IX.holding ? 'hold' : 'slip'}">
        ${IX.holding ? '✓ holding' : '✗ slipping'} · ${IX.first.toFixed(1)}% → ${IX.last.toFixed(1)}%
        (${IX.indexed}/${IX.checked} indexed)
      </span>
      <div class="bars">
        ${cap('Posts, 7d', T.used.posts, T.caps.posts_per_week)}
        ${cap('On-page fixes, 7d', T.used.onpage, T.caps.onpage_per_week)}
        <div class="cap"><span>Removals, 7d</span><span class="track"></span>
          <span class="n">${T.used.removed}</span></div>
        <div class="cap"><span>Pages cooling down</span><span class="track"></span>
          <span class="n">${T.used.cooling}</span></div>
      </div>
      <p class="goal" style="margin-top:12px">Executing to plan. The outcome it has not yet moved:
        acquisition queries still return <b>${n0(T.acquisition_clicks)}</b> attributed clicks at an
        average position of <b>${T.acquisition_position.toFixed(0)}</b>.</p>
    </div>
  </div>`;

/* ---- static panels ----------------------------------------------------- */
const A = D.aeo;
$('aeo').innerHTML =
  `<div class="kv"><span>Questions probed</span><b>${A.probes}</b></div>
   <div class="kv"><span>DailyVox named in the answer</span><b>${A.mentioned} (${A.probes ? Math.round(A.mentioned / A.probes * 100) : 0}%)</b></div>
   <div class="kv"><span>getdailyvox.com cited</span><b>${A.cited}</b></div>`
  + A.domains.slice(0, 8).map(d =>
      `<div class="kv"><span class="mono" style="font-size:12px">${d.domain}</span><b>${d.count}</b></div>`).join('');

$('loop').innerHTML = D.loop.length
  ? D.loop.map(r => `<div class="kv"><span>${r.kind} · ${r.status}</span><b>${r.n}</b></div>`).join('')
  : '<div class="kv"><span>No ledger activity</span><b>0</b></div>';

$('striking').innerHTML = D.striking.map(r => {
  const wide = r.head_position && Math.abs(r.head_position - r.position) >= 8;
  return `<tr><td class="txt mono" style="font-size:12px">${r.page}</td>
    <td class="txt">${r.query || '—'}</td>
    <td class="n mono">${n0(r.impressions)}</td><td class="n mono">${n0(r.clicks)}</td>
    <td class="n mono">${r.position.toFixed(1)}</td>
    <td class="n mono ${wide ? 'warn' : ''}">${r.head_position ? r.head_position.toFixed(1) : '—'}</td></tr>`;
}).join('') || '<tr><td colspan="6" class="empty">Nothing in striking distance.</td></tr>';

$('stamp').textContent = `generated ${D.generated} · data through ${D.data_through}`;
$('footer').innerHTML =
  `<code>autoseo dashboard</code> regenerates this from <code>state/*.csv</code>. Positions are
   impression-weighted throughout. Intent is the same <code>decide/brand.py</code> classifier the
   autonomous loop plans against, so this page and the nightly decisions cannot disagree about what
   counts as acquisition.`;

/* ---- go ---------------------------------------------------------------- */
function render() { drawMetrics(); drawCharts(); drawTable(); }
render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement,
  { attributes: true, attributeFilter: ['data-theme'] });
</script>
